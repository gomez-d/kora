# Kora V2.0.0 — Docker Compose

services:
  # ---------------------------------------------------------------------------
  # Databases
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB: ${POSTGRES_DB}
    secrets:
      - postgres_password
      - identity_password
      - business_password
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  mongo:
    image: mongo:7
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  # ---------------------------------------------------------------------------
  # Microservices
  # ---------------------------------------------------------------------------
  api-gateway:
    build: ./api-gateway
    env_file:
      - ./api-gateway/.env
      - ./api-gateway/.env.docker
    ports:
      - "${GATEWAY_PORT:-8000}:8000"
    depends_on:
      - svc-identity
      - svc-business
    restart: unless-stopped

  svc-identity:
    build: ./svc-identity
    env_file:
      - ./svc-identity/.env
      - ./svc-identity/.env.docker
    ports:
      - "${IDENTITY_PORT:-8001}:8000"
    secrets:
      - identity_password
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  svc-business:
    build: ./svc-business
    env_file:
      - ./svc-business/.env
      - ./svc-business/.env.docker
    ports:
      - "${BUSINESS_PORT:-8002}:8000"
    secrets:
      - business_password
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  svc-unstructured-data:
    build: ./svc-unstructured-data
    env_file:
      - ./svc-unstructured-data/.env
      - ./svc-unstructured-data/.env.docker
    ports:
      - "${UNSTRUCTURED_DATA_PORT:-8003}:8000"
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped

  svc-ai:
    build: ./svc-ai
    env_file:
      - ./svc-ai/.env
      - ./svc-ai/.env.docker
    ports:
      - "${AI_PORT:-8004}:8000"
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Frontend
  # ---------------------------------------------------------------------------
  frontend:
    build: ./frontend
    ports:
      - "${FRONTEND_PORT:-5500}:80"
    depends_on:
      - api-gateway
    restart: unless-stopped

# ---------------------------------------------------------------------------
# Docker Secrets
# ---------------------------------------------------------------------------
secrets:
  postgres_password:
    file: ./docker/postgres/secrets/postgres_password.txt
  identity_password:
    file: ./docker/postgres/secrets/identity_password.txt
  business_password:
    file: ./docker/postgres/secrets/business_password.txt

# ---------------------------------------------------------------------------
# Volumes
# ---------------------------------------------------------------------------
volumes:
  postgres_data:
  mongo_data: