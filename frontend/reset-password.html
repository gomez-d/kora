
<!DOCTYPE html>
<html lang="es" class="no-js">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Restablecer contraseña | Kora</title>

    <script>
        document.documentElement.classList.remove('no-js');
        document.documentElement.classList.add('js');
    </script>

    <link rel="stylesheet" href="css/vendor.css">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/formulario.css">

    <link rel="icon" type="image/svg+xml" href="images/k.svg">
</head>

<body id="top">

    <div id="preloader">
        <div id="loader" class="dots-fade">
            <div></div>
            <div></div>
            <div></div>
        </div>
    </div>

    <div id="page" class="s-pagewrap">

        <article class="s-content">

            <section
                class="s-pageheader pageheader"
                style="background-image: url('images/login.jpg');"
            >
                <div class="row">
                    <div class="column xl-12 s-pageheader__content">
                        <h1 class="page-title">Restablecer contraseña</h1>
                    </div>
                </div>
            </section>

            <section class="row width-narrower row-x-center content-block content-block--grey cta-block">

                <div class="column xl-10 mob-12">

                    <div class="row row-x-center">
                        <div class="column xl-8 lg-10 md-10 tab-12">

                            <h3>Establece una nueva contraseña</h3>

                            <p>
                                Ingresa y confirma tu nueva contraseña para
                                recuperar el acceso a tu cuenta.
                            </p>

                            <form
                                name="resetPasswordForm"
                                id="resetPasswordForm"
                                class="formulario-auth"
                                method="post"
                            >
                                <fieldset>

                                    <div class="campo-formulario">
                                        <label for="newPasswordInput">
                                            Nueva contraseña
                                        </label>

                                        <input
                                            name="new_password"
                                            type="password"
                                            id="newPasswordInput"
                                            placeholder="Nueva contraseña"
                                            autocomplete="new-password"
                                            minlength="8"
                                            required
                                        >
                                    </div>

                                    <div class="campo-formulario">
                                        <label for="confirmPasswordInput">
                                            Confirmar contraseña
                                        </label>

                                        <input
                                            name="confirm_password"
                                            type="password"
                                            id="confirmPasswordInput"
                                            placeholder="Repite tu contraseña"
                                            autocomplete="new-password"
                                            minlength="8"
                                            required
                                        >
                                    </div>

                                    <button
                                        type="submit"
                                        id="resetSubmitButton"
                                        class="btn btn--primary btn--large boton-formulario"
                                    >
                                        Restablecer contraseña
                                    </button>

                                    <p
                                        id="resetFormMessage"
                                        role="status"
                                        aria-live="polite"
                                        hidden
                                    ></p>

                                </fieldset>
                            </form>

                            <div class="text-center u-add-top">
                                <p>
                                    ¿Recordaste tu contraseña?
                                    <a href="login.html">
                                        Volver a iniciar sesión
                                    </a>
                                </p>
                            </div>

                        </div>
                    </div>

                </div>

            </section>

        </article>

        <footer class="s-footer">

            <div class="row s-footer__bottom">

                <div class="column xl-6 lg-12">
                    <p class="ss-copyright">
                        <span>© Copyright KORA 2026</span>
                    </p>
                </div>

            </div>

        </footer>

    </div>

    <script src="js/plugins.js"></script>
    <script src="js/main.js"></script>

    <script src="js/kora-config.js"></script>
    <script src="js/kora-api.js"></script>
    <script src="js/kora-password-reset.js"></script>

</body>
</html>
