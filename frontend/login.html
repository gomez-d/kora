
<!DOCTYPE html>
<html lang="es" class="no-js">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Iniciar sesión | Kora</title>

    <script>
        document.documentElement.classList.remove('no-js');
        document.documentElement.classList.add('js');
    </script>

    <link rel="stylesheet" href="css/vendor.css">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/formulario.css">

    <link rel="icon" type="image/svg+xml" href="images/k.svg">
    <link rel="manifest" href="site.webmanifest">
</head>

<body id="top">

    <div id="preloader">
        <div id="loader" class="dots-fade">
            <div></div>
            <div></div>
            <div></div>
        </div>
    </div>

    <div id="page" class="s-pagewrap">

        <article class="s-content">

            <section
                class="s-pageheader pageheader"
                style="background-image: url('images/login.jpg');"
            >
                <div class="row">
                    <div class="column xl-12 s-pageheader__content">
                        <h1 class="page-title">Iniciar sesión</h1>
                    </div>
                </div>
            </section>

            <section class="row width-narrower row-x-center content-block content-block--grey cta-block">

                <div class="column xl-10 mob-12">

                    <div class="row row-x-center">
                        <div class="column xl-8 lg-10 md-10 tab-12">

                            <h3>Bienvenido de nuevo</h3>

                            <p>
                                Ingresa a tu cuenta para continuar con tu
                                seguimiento nutricional.
                            </p>

                                <form
                                    name="loginForm"
                                    id="loginForm"
                                    class="formulario-auth"
                                    method="post"
                                >

                                <fieldset>

                                    <div class="campo-formulario">
                                        <label for="emailInput">
                                            Correo electrónico
                                        </label>
                                        <input
                                            name="email"
                                            type="email"
                                            id="emailInput"
                                            placeholder="tu@correo.com"
                                            autocomplete="email"
                                            required
                                        >
                                    </div>

                                    <div class="campo-formulario">
                                        <label for="passwordInput">
                                            Contraseña
                                        </label>
                                        <input
                                            name="password"
                                            type="password"
                                            id="passwordInput"
                                            placeholder="Ingresa tu contraseña"
                                            autocomplete="current-password"
                                            required
                                        >
                                    </div>

                                    <div class="opcion-formulario">
                                        <label for="showPassword">
                                            <input
                                                type="checkbox"
                                                id="showPassword"
                                            >
                                            <span class="label-text">
                                                Mostrar contraseña
                                            </span>
                                        </label>
                                    </div>

                                    <div class="opcion-formulario">
                                        <label for="remember">
                                            <input
                                                type="checkbox"
                                                name="remember"
                                                id="remember"
                                            >
                                            <span class="label-text">
                                                Recordar mi cuenta
                                            </span>
                                        </label>
                                    </div>

                                    <button
                                        type="submit"
                                        class="btn btn--primary btn--large boton-formulario"
                                    >
                                        Entrar a Kora
                                    </button>

                                </fieldset>
                            </form>

                            <div class="text-center u-add-top">
                                <p>
                                    ¿Olvidaste tu contraseña?
                                    <a href="forgot-password.html">
                                        Recuperarla
                                    </a>
                                </p>

                                <p>
                                    ¿No tienes una cuenta?
                                    <a href="registration.html">
                                        Regístrate aquí
                                    </a>
                                </p>
                            </div>

                        </div>
                    </div>

                </div>

            </section>

        </article>

        <footer class="s-footer">

            <div class="row s-footer__bottom">

                <div class="column xl-6 lg-12">
                    <p class="ss-copyright">
                        <span>© Copyright KORA 2026</span>
                    </p>
                </div>

            </div>

        </footer>

    </div>

    <script src="js/plugins.js"></script>
    <script src="js/main.js"></script>

    <script>
        const showPassword = document.getElementById('showPassword');
        const passwordInput = document.getElementById('passwordInput');

        showPassword.addEventListener('change', function () {
            passwordInput.type = this.checked ? 'text' : 'password';
        });
    </script>


    <script src="js/kora-config.js"></script>
    <script src="js/kora-api.js"></script>
    <script src="js/kora-auth.js"></script>

</body>
</html>
